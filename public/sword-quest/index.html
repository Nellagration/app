<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sword Quest — A Tiny Hero Adventure</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    width:min(100vw,calc(100vh * 1.0667));max-height:100vh;}
  #bar{position:fixed;top:6px;right:8px;display:flex;gap:8px;z-index:5;}
  #bar button{background:#222;color:#eee;border:1px solid #555;border-radius:6px;
    font-family:monospace;font-size:13px;padding:4px 10px;cursor:pointer;}
  .pad{position:fixed;z-index:5;opacity:.5;}
  #dpad{left:14px;bottom:14px;width:126px;height:126px;}
  .db{position:absolute;width:42px;height:42px;background:#999;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#222;font-size:20px;}
  #abtn{right:18px;bottom:32px;width:64px;height:64px;background:#c33;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;
    font-weight:bold;font-family:monospace;}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="256" height="240"></canvas></div>
<div id="bar">
  <button id="voiceBtn">&#128266; Voice: ON</button>
  <button id="resetBtn">&#8635; Start Over</button>
</div>
<div id="dpad" class="pad">
  <div class="db" data-k="up"    style="left:42px;top:0">&#9650;</div>
  <div class="db" data-k="left"  style="left:0;top:42px">&#9664;</div>
  <div class="db" data-k="right" style="left:84px;top:42px">&#9654;</div>
  <div class="db" data-k="down"  style="left:42px;top:84px">&#9660;</div>
</div>
<div id="abtn" class="pad">A</div>
<script src="game.js"></script>
</body>
</html>
